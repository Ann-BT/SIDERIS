# ──────────────────────────────────────────────────────────
# docker-compose.yml
# SIDERIS — Production Deployment Configuration
# ──────────────────────────────────────────────────────────

services:

  # ── Redis — event stream + session state ───────────────
  redis:
    image: redis:7-alpine
    container_name: sideris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL — persistent SOC storage ────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sideris-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sideris}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sideris}
      - POSTGRES_DB=${POSTGRES_DB:-sideris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sideris} -d $${POSTGRES_DB:-sideris}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── SIDERIS — WAF Proxy + telemetry backend + Dashboard ─
  sideris:
    build: .
    container_name: sideris-app
    # Uses host networking to easily proxy to local websites on the host
    # and bind dashboard/proxy ports to the host interface.
    network_mode: host
    environment:
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://sideris:sideris@localhost:5432/sideris}
      - TARGET_URL=${TARGET_URL:-http://localhost:3001}
      - STOREFRONT_URL=${STOREFRONT_URL:-http://localhost:3001}
      - PROXY_PORT=${PROXY_PORT:-4000}
      - INGEST_PORT=${INGEST_PORT:-5000}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-6001}
      - INGEST_HOST=${INGEST_HOST:-http://localhost:5000}
      - DASHBOARD_ALLOWED_IPS=${DASHBOARD_ALLOWED_IPS:-127.0.0.1,::1}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
