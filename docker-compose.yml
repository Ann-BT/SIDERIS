# ──────────────────────────────────────────────────────────
# docker-compose.yml
# SIDERIS 2.0 — Infrastructure Services
#
# Starts: Redis + PostgreSQL + OWASP Juice Shop
#
# Run with:  docker compose up -d
# Stop with: docker compose down
# Nuke data: docker compose down -v
# ──────────────────────────────────────────────────────────

services:

  # ── Redis — event stream + session state ───────────────
  redis:
    image: redis:7-alpine
    container_name: sideris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL — persistent SOC storage ────────────────
  postgres:
    image: mirror.gcr.io/library/postgres:16
    container_name: sideris-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sideris
      POSTGRES_PASSWORD: sideris
      POSTGRES_DB: sideris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sideris -d sideris"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── OWASP Juice Shop — target application ──────────────
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: sideris-juice
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── SIDERIS — WAF Proxy + telemetry backend + Dashboard ─
  sideris:
    build: .
    container_name: sideris-app
    ports:
      - "4000:4000" # WAF Proxy
      - "5000:5000" # Telemetry Ingest (Internal)
      - "6001:6001" # Dashboard API
      - "5173:5173" # Dashboard UI (Vite dev server)
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://sideris:sideris@postgres:5432/sideris
      - TARGET_URL=http://juice-shop:3000
      - PROXY_PORT=4000
      - INGEST_PORT=5000
      - DASHBOARD_PORT=6001
      - INGEST_HOST=http://localhost:5000
      - DASHBOARD_ALLOWED_IPS=${DASHBOARD_ALLOWED_IPS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
